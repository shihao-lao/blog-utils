version: '3.8'

services:
  auto-platform:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: auto-platform
    restart: unless-stopped
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
      - ../.env:/app/.env
    environment:
      - NODE_ENV=production
    # 如果需要有头浏览器（调试用）
    # ports:
    #   - "9222:9222"
    #   - "5900:5900"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
